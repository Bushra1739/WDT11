<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - WanderWorld</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="navbar">

            <h2 class="logo">✈ WanderWorld</h2>


            <a href="index.html">HOME</a>
            <a href="destinations.html">DESTINATIONS</a>
            <a href="packages.html">PACKAGES</a>
            <a href="gallery.html">GALLERY</a>
            <a href="about.html">ABOUT US</a>
            <a href="contact.html">CONTACT US</a>


        </nav>
    </header>
    <section class="contact-hero">
        <h1>Contact Us</h1>
        <p>Let's plan your next adventure!</p>
    </section>
    <section class="contact-section">

        <div class="contact-info">
            <h2>Get in Touch</h2>

            <p>Have questions about your next trip?</p>

            <p>📧 Email: wanderworld@example.com</p>

            <p>📍 Location: Ahmedabad, Gujarat, India</p>

            <p>🌍 Your journey begins with us!</p>
        </div>
        <div class="contact-form">

            <h2>Send Us a Message</h2>

            <form action="#" method="get">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="destination">Choose Destination</label>

                <select id="destination" name="destination" required>
                    <option value="">Select a destination</option>
                    <option value="Goa">Goa</option>
                    <option value="Manali">Manali</option>
                    <option value="Jaipur">Jaipur</option>
                    <option value="Bali">Bali</option>
                    <option value="Kashmir">Kashmir</option>
                    <option value="Kerala">Kerala</option>
                </select>

                <label for="message">Your Message</label>

                <textarea id="message" name="message" rows="5" placeholder="Write your message here..."
                    required></textarea>

                <button type="submit" class="submit-btn">
                    Send Message
                </button>

            </form>

        </div>

    </section>

</body>

</html>
